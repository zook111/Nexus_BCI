name: Ask a question or suggest an improvement
description: Ask how something works or explain a change that would help.
body:
  - type: markdown
    attributes:
      value: |
        No coding knowledge needed. If something is broken, use **Report a problem** instead. The [student reporting guide](https://github.com/zook111/Nexus_BCI/blob/main/docs/report-a-problem.md) explains both forms.

        **This conversation is public.** Leave out personal information, secrets, Mac serial numbers, participant recordings, and participant results. Check any attachments. Tell Karl privately about sensitive information or security problems.

        For a possible security flaw or exposed credential, use a [private vulnerability report](https://github.com/zook111/Nexus_BCI/security/advisories/new). Read the [security policy](https://github.com/zook111/Nexus_BCI/blob/main/SECURITY.md). If that route is unavailable, ask your parent or teacher to contact Karl privately; do not post sensitive information here.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like help with?
      options:
        - Understanding how something works
        - A suggestion for the app or guides
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What is your question or idea?
      description: Say which screen or guide you are using, what you want to do, and where you got stuck. For a suggestion, explain how it would help your project.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Check before posting
      options:
        - label: I checked my text and attachments. They contain no personal information, secrets, participant recordings, or participant results. I understand that this issue is public.
          required: true
