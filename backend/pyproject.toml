[project]
name = "mindmeld-api"
version = "0.1.0"
authors = [{name = "zook111"}]
license = "MIT"
description = "Backend API for OpenBCI acquisition, processing, and realtime UI streaming."
requires-python = ">=3.12"
dependencies = [
  "brainflow>=5.22.1,<6.0.0",
  "fastapi[standard]>=0.115.0,<1.0.0",
  "numpy>=2.0.0,<3.0.0",
  "orjson>=3.10.0,<4.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "pyserial>=3.5,<4.0",
  "pyriemann>=0.9,<0.10",
  "scikit-learn>=1.6,<2.0",
  "scipy>=1.14.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/zook111/Nexus_BCI"
Repository = "https://github.com/zook111/Nexus_BCI"
Issues = "https://github.com/zook111/Nexus_BCI/issues"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmeld_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
